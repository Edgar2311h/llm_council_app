name: llm_council_app
description: "Executive-tier LLM Council mobile app for CEOs and high-ranking professionals."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

  # Storage
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Networking
  dio: ^5.7.0
  
  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.4+3
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.19.0
  url_launcher: ^6.2.4
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
